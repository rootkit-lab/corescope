<?xml version="1.0" encoding="UTF-8"?>
<!-- cppcheck config — análise estática complementar ao clang-tidy -->
<project version="1">
  <root name="."/>
  <includepaths>
    <dir name="include"/>
    <dir name="third_party/openssl-mingw/prefix/include"/>
  </includepaths>
  <exclude>
    <dir name="third_party"/>
    <dir name="tests/unity"/>
    <dir name="build"/>
  </exclude>
  <addons>
    <addon name="cert-c"/>
  </addons>
  <suppress>missingIncludeSystem</suppress>
</project>
